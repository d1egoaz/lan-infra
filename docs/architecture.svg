<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1280" viewBox="0 0 980 1280">
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #111827; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #111827; }
      .node { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #111827; }
      .box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 12; }
      .group { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.5; rx: 14; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <text class="title" x="36" y="48">lan-infra architecture (high-level)</text>

  <!-- Clients -->
  <rect class="group" x="30" y="80" width="920" height="150" />
  <text class="label" x="50" y="112">Clients</text>
  <rect class="box" x="60" y="130" width="250" height="56" /><text class="node" x="88" y="164">iPhone / Apple Home</text>
  <rect class="box" x="350" y="130" width="250" height="56" /><text class="node" x="396" y="164">Browsers / LAN clients</text>
  <rect class="box" x="640" y="130" width="250" height="56" /><text class="node" x="710" y="164">Media clients</text>

  <!-- Edge -->
  <rect class="group" x="30" y="270" width="920" height="180" />
  <text class="label" x="50" y="302">Edge & Access</text>
  <rect class="box" x="60" y="330" width="250" height="70" /><text class="node" x="122" y="372">cloudflared</text>
  <rect class="box" x="350" y="330" width="250" height="70" /><text class="node" x="395" y="372">nginx-proxy-manager</text>
  <rect class="box" x="640" y="330" width="250" height="70" /><text class="node" x="669" y="372">tailscale-subnet-router</text>

  <!-- Control -->
  <rect class="group" x="30" y="490" width="920" height="150" />
  <text class="label" x="50" y="522">Control Plane</text>
  <rect class="box" x="60" y="540" width="380" height="60" /><text class="node" x="150" y="577">GitHub repo + PR workflow</text>
  <rect class="box" x="510" y="540" width="380" height="60" /><text class="node" x="665" y="577">Portainer</text>

  <!-- Core -->
  <rect class="group" x="30" y="680" width="920" height="230" />
  <text class="label" x="50" y="712">Core Services</text>
  <rect class="box" x="60" y="740" width="240" height="64" /><text class="node" x="113" y="779">Home Assistant</text>
  <rect class="box" x="330" y="740" width="240" height="64" /><text class="node" x="395" y="779">avahi-reflector</text>
  <rect class="box" x="600" y="740" width="140" height="64" /><text class="node" x="646" y="779">redis</text>
  <rect class="box" x="760" y="740" width="160" height="64" /><text class="node" x="798" y="779">postgres</text>
  <rect class="box" x="600" y="826" width="140" height="64" /><text class="node" x="631" y="865">mosquitto</text>
  <rect class="box" x="760" y="826" width="160" height="64" /><text class="node" x="789" y="865">signal-cli-rpc</text>

  <!-- Apps -->
  <rect class="group" x="30" y="950" width="920" height="280" />
  <text class="label" x="50" y="982">App Services (examples)</text>
  <rect class="box" x="60" y="1015" width="160" height="56" /><text class="node" x="106" y="1048">openclaw</text>
  <rect class="box" x="240" y="1015" width="160" height="56" /><text class="node" x="291" y="1048">nextcloud</text>
  <rect class="box" x="420" y="1015" width="160" height="56" /><text class="node" x="458" y="1048">paperless-ngx</text>
  <rect class="box" x="600" y="1015" width="160" height="56" /><text class="node" x="654" y="1048">immich</text>
  <rect class="box" x="780" y="1015" width="160" height="56" /><text class="node" x="837" y="1048">plex</text>

  <rect class="box" x="240" y="1090" width="160" height="56" /><text class="node" x="269" y="1123">signal-cli-rest-api</text>
  <rect class="box" x="420" y="1090" width="160" height="56" /><text class="node" x="469" y="1123">adguard</text>

  <!-- Arrows -->
  <path class="arrow" d="M185,186 L185,330" />
  <path class="arrow" d="M475,186 L475,330" />
  <path class="arrow" d="M765,186 L765,330" />

  <path class="arrow" d="M475,400 L700,540" />
  <path class="arrow" d="M185,400 L700,540" />
  <path class="arrow" d="M765,400 L700,540" />

  <path class="arrow" d="M250,570 L510,570" />
  <path class="arrow" d="M700,600 L180,740" />
  <path class="arrow" d="M700,600 L450,740" />

  <path class="arrow" d="M180,804 L180,1015" />
  <path class="arrow" d="M700,804 L510,1015" />
  <path class="arrow" d="M840,804 L320,1090" />
  <path class="arrow" d="M680,890 L500,1090" />

  <text class="node" x="36" y="1260" fill="#334155">HomeKit bridge mode: HA published ports + avahi reflector + advertise_ip in HA config.</text>
</svg>
