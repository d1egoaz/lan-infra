<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="30" y="42" font-family="Arial" font-size="28" font-weight="700" fill="#111827">lan-infra network zones</text>

  <!-- Outside -->
  <rect x="30" y="80" width="1220" height="110" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="50" y="110" font-family="Arial" font-size="18" font-weight="700" fill="#312E81">Outside network clients</text>
  <rect x="60" y="125" width="260" height="48" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="98" y="154" font-family="Arial" font-size="15">Remote users / internet</text>

  <!-- DMZ -->
  <rect x="30" y="215" width="1220" height="180" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="50" y="246" font-family="Arial" font-size="18" font-weight="700" fill="#9A3412">DMZ / Edge zone</text>
  <rect x="60" y="270" width="250" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="122" y="304" font-family="Arial" font-size="15">cloudflared</text>
  <rect x="340" y="270" width="280" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="386" y="304" font-family="Arial" font-size="15">nginx-proxy-manager</text>
  <rect x="650" y="270" width="270" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="690" y="304" font-family="Arial" font-size="15">tailscale-subnet-router</text>
  <rect x="950" y="270" width="270" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="1006" y="304" font-family="Arial" font-size="15">macmini4 host</text>

  <!-- Control -->
  <rect x="30" y="420" width="1220" height="120" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="50" y="450" font-family="Arial" font-size="18" font-weight="700" fill="#334155">Control plane</text>
  <rect x="60" y="470" width="360" height="50" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="142" y="500" font-family="Arial" font-size="15">GitHub repo + PR workflow</text>
  <rect x="450" y="470" width="220" height="50" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="503" y="500" font-family="Arial" font-size="15">Portainer #1</text>
  <rect x="700" y="470" width="220" height="50" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="753" y="500" font-family="Arial" font-size="15">Portainer #2</text>

  <!-- Common services -->
  <rect x="30" y="565" width="1220" height="130" rx="12" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
  <text x="50" y="596" font-family="Arial" font-size="18" font-weight="700" fill="#0C4A6E">Common services layer</text>
  <rect x="60" y="620" width="200" height="52" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="125" y="651" font-family="Arial" font-size="15">redis</text>
  <rect x="290" y="620" width="220" height="52" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="355" y="651" font-family="Arial" font-size="15">postgres</text>
  <rect x="540" y="620" width="220" height="52" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="592" y="651" font-family="Arial" font-size="15">mosquitto</text>
  <rect x="790" y="620" width="220" height="52" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="833" y="651" font-family="Arial" font-size="15">signal-cli-rpc</text>
  <rect x="1040" y="620" width="180" height="52" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="1086" y="651" font-family="Arial" font-size="15">adguard</text>

  <!-- Inside apps -->
  <rect x="30" y="720" width="1220" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="50" y="750" font-family="Arial" font-size="18" font-weight="700" fill="#065F46">Inside LAN apps</text>
  <rect x="60" y="772" width="210" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="102" y="806" font-family="Arial" font-size="15">Home Assistant</text>
  <rect x="300" y="772" width="200" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="341" y="806" font-family="Arial" font-size="15">avahi-reflector</text>
  <rect x="530" y="772" width="180" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="580" y="806" font-family="Arial" font-size="15">signal-rest-api</text>
  <rect x="740" y="772" width="160" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="790" y="806" font-family="Arial" font-size="15">ghost</text>
  <rect x="930" y="772" width="150" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="974" y="806" font-family="Arial" font-size="15">plex</text>
  <rect x="1110" y="772" width="120" height="56" rx="10" fill="#fff" stroke="#94A3B8"/>
  <text x="1128" y="806" font-family="Arial" font-size="15">immich</text>

  <!-- Connectors -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="190" y1="173" x2="185" y2="270"/>
    <line x1="185" y1="326" x2="480" y2="326"/>
    <line x1="480" y1="326" x2="480" y2="470"/>
    <line x1="1060" y1="326" x2="810" y2="470"/>
    <line x1="560" y1="520" x2="650" y2="620"/>
    <line x1="810" y1="520" x2="900" y2="620"/>
    <line x1="650" y1="672" x2="650" y2="772"/>
    <line x1="900" y1="672" x2="620" y2="772"/>
    <line x1="900" y1="672" x2="820" y2="772"/>
    <line x1="120" y1="672" x2="165" y2="772"/>
  </g>

  <text x="30" y="892" font-family="Arial" font-size="14" fill="#475569">Internet exposure path: Internet → cloudflared → nginx-proxy-manager → internal services. HomeKit bridge mode still needs HA advertise_ip + avahi reflector.</text>
</svg>
