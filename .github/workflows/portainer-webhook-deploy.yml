name: Portainer Webhook Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**/compose.yaml'
      - '.github/workflows/portainer-webhook-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for diff
  
      - name: Detect and deploy changed services
        env:
          PORTAINER_WEBHOOK_HELLO: ${{ secrets.PORTAINER_WEBHOOK_HELLO }}
          PORTAINER_WEBHOOK_CLOUDFLARED: ${{ secrets.PORTAINER_WEBHOOK_CLOUDFLARED }}
          # ⚠️ IMPORTANT: When adding a new service, add its webhook secret here!
          # Example for 'home-assistant' service:
          # PORTAINER_WEBHOOK_HOME_ASSISTANT: ${{ secrets.PORTAINER_WEBHOOK_HOME_ASSISTANT }}
        run: |
          echo "🚀 Portainer Webhook Deploy"
          echo "============================="
          
          # Check if we have a previous commit to diff against
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "⚠️ No previous commit found (might be initial commit)"
            echo "❓ Cannot determine what changed - skipping deployment"
            exit 0
          fi
          
          # Get list of changed files
          echo "Checking for changed compose files..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "📝 No files changed between commits"
            exit 0
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES" | while read -r file; do
            echo "  - $file"
          done
          
          # Process each changed file
          DEPLOYMENT_FAILED=0
          echo "$CHANGED_FILES" | while read -r file; do
            if [[ "$file" == services/*/compose.yaml ]]; then
              # Extract service name from path (e.g., services/hello/compose.yaml -> hello)
              SERVICE_NAME=$(echo "$file" | cut -d'/' -f2)
              
              # Convert service name to secret name format
              # e.g., home-assistant -> HOME_ASSISTANT
              SECRET_NAME=$(echo "PORTAINER_WEBHOOK_$(echo "$SERVICE_NAME" | tr '-' '_' | tr '[:lower:]' '[:upper:]')")
              
              echo ""
              echo "--- Deploying $SERVICE_NAME ---"
              echo "Looking for secret: $SECRET_NAME"
              
              # Get webhook URL from environment variable
              # Indirect variable reference in bash
              WEBHOOK_URL_VAR_NAME="$SECRET_NAME"
              WEBHOOK_URL="${!WEBHOOK_URL_VAR_NAME}"
              
              if [ -z "$WEBHOOK_URL" ]; then
                echo "❌ Secret '$SECRET_NAME' not found or empty"
                echo "Please add webhook URL for $SERVICE_NAME service to GitHub secrets"
                echo "And update this workflow to pass the secret as environment variable"
                DEPLOYMENT_FAILED=1
                continue
              fi
              
              if [[ ! "$WEBHOOK_URL" =~ ^https:// ]]; then
                echo "❌ Invalid webhook URL for $SERVICE_NAME. Must be HTTPS."
                DEPLOYMENT_FAILED=1
                continue
              fi
              
              echo "Triggering webhook for $SERVICE_NAME..."
              
              # Try webhook with retry logic
              MAX_RETRIES=3
              RETRY_DELAY=5
              
              for i in $(seq 1 $MAX_RETRIES); do
                echo "Attempt $i of $MAX_RETRIES..."
                
                RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
                  -X POST \
                  -H "User-Agent: GitHub Actions (Portainer Deploy)" \
                  -m 10 \
                  "$WEBHOOK_URL?action=redeploy" 2>/dev/null || echo "CURL_ERROR")
                
                if [ "$RESPONSE" = "CURL_ERROR" ]; then
                  HTTP_STATUS="000"
                  BODY="curl failed"
                else
                  HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
                  BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
                fi
                
                if [ "$HTTP_STATUS" = "204" ] || [ "$HTTP_STATUS" = "200" ]; then
                  echo "✅ Successfully triggered redeploy for $SERVICE_NAME"
                  break
                elif [ $i -lt $MAX_RETRIES ]; then
                  echo "⚠️ Attempt $i failed (HTTP $HTTP_STATUS), retrying in ${RETRY_DELAY}s..."
                  if [ -n "$BODY" ] && [ "$BODY" != "CURL_ERROR" ]; then
                    echo "Error: $BODY"
                  fi
                  sleep $RETRY_DELAY
                else
                  echo "❌ All attempts failed for $SERVICE_NAME (HTTP $HTTP_STATUS)"
                  if [ -n "$BODY" ] && [ "$BODY" != "CURL_ERROR" ]; then
                    echo "Error: $BODY"
                  fi
                  echo ""
                  echo "Troubleshooting:"
                  echo "1. Check if webhook is enabled in Portainer UI"
                  echo "2. Verify the webhook URL in secret '$SECRET_NAME'"
                  echo "3. Ensure Portainer is accessible from GitHub Actions"
                  DEPLOYMENT_FAILED=1
                fi
              done
            fi
          done
          
          echo ""
          echo "📊 Deployment complete"
          if [ $DEPLOYMENT_FAILED -eq 1 ]; then
            echo "❌ Some deployments failed"
            exit 1
          else
            echo "✅ All deployments successful or no services needed deployment"
          fi