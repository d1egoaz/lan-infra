networks:
  ha_signal_private:
    external: true
  signal_egress:

volumes:
  openclaw_state:
    name: openclaw_state
  signal-cli-jsonrpc-config:
    name: signal-cli-jsonrpc

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.3.1@sha256:dcf11a3a97a9b0e42dd41fcd4891533e77ff72e7b0380c743177bfbfd6f38b2d
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-America/Vancouver}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      HA_TOKEN: ${HA_TOKEN}
      HA_UI_PASS: ${HA_UI_PASS}
      HA_UI_USER: ${HA_UI_USER}
      HA_URL: ${HA_URL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_PERPLEXITY_API_KEY: ${OPENCLAW_PERPLEXITY_API_KEY}
      OPENCLAW_PERPLEXITY_MODEL: ${OPENCLAW_PERPLEXITY_MODEL}
      OPENCLAW_SIGNAL_HTTP_URL: ${OPENCLAW_SIGNAL_HTTP_URL}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      PORTAINER_URL: ${PORTAINER_URL}
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      - openclaw_state:/home/node/.openclaw
    networks:
      ha_signal_private:
        aliases:
          - openclaw-gateway
      signal_egress:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/tmp

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:2026.3.1@sha256:dcf11a3a97a9b0e42dd41fcd4891533e77ff72e7b0380c743177bfbfd6f38b2d
    profiles:
      - cli
    init: true
    environment:
      TZ: ${TZ:-America/Vancouver}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      HA_TOKEN: ${HA_TOKEN}
      HA_UI_PASS: ${HA_UI_PASS}
      HA_UI_USER: ${HA_UI_USER}
      HA_URL: ${HA_URL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_PERPLEXITY_API_KEY: ${OPENCLAW_PERPLEXITY_API_KEY}
      OPENCLAW_PERPLEXITY_MODEL: ${OPENCLAW_PERPLEXITY_MODEL}
      OPENCLAW_SIGNAL_HTTP_URL: ${OPENCLAW_SIGNAL_HTTP_URL}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      PORTAINER_URL: ${PORTAINER_URL}
    volumes:
      - openclaw_state:/home/node/.openclaw
    networks:
      - ha_signal_private
      - signal_egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/tmp

  signal-rpc:
    image: registry.gitlab.com/packaging/signal-cli/signal-cli-jre:v0-13-24-1@sha256:dff0a8c7068683c9904183e4cf04f4cfbcf5eaf558b74091ceab886e67a1ff40
    user: "1000:1000"
    command: ["--config", "/var/lib/signal-cli", "daemon", "--http", "0.0.0.0:7583"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - signal-cli-jsonrpc-config:/var/lib/signal-cli
      # Mount OpenClaw state root so /home/node/.openclaw/media resolves correctly.
      - openclaw_state:/home/node/.openclaw:ro
    tmpfs:
      - /tmp:exec
    networks:
      ha_signal_private:
        aliases:
          - signal-rpc
      signal_egress:
    expose:
      - "7583"
