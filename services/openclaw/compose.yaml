networks:
  ha_signal_private:
    external: true
  signal_egress:

volumes:
  openclaw_state:
    name: openclaw_state
  signal-cli-jsonrpc-config:
    name: signal-cli-jsonrpc

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.2.21@sha256:ce271192cd70250d16fc5911903d9953467a40faf8b34e87cbd042e6b49b6036
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-America/Vancouver}
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      - openclaw_state:/home/node/.openclaw
    networks:
      ha_signal_private:
        aliases:
          - openclaw-gateway
      signal_egress:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/tmp

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:2026.2.21@sha256:ce271192cd70250d16fc5911903d9953467a40faf8b34e87cbd042e6b49b6036
    profiles:
      - cli
    init: true
    environment:
      TZ: ${TZ:-America/Vancouver}
    volumes:
      - openclaw_state:/home/node/.openclaw
    networks:
      - ha_signal_private
      - signal_egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/tmp

  signal-rpc:
    image: registry.gitlab.com/packaging/signal-cli/signal-cli-jre:v0-13-24-1@sha256:dff0a8c7068683c9904183e4cf04f4cfbcf5eaf558b74091ceab886e67a1ff40
    command: ["--config", "/var/lib/signal-cli", "daemon", "--http", "0.0.0.0:7583"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - signal-cli-jsonrpc-config:/var/lib/signal-cli
      # Mount OpenClaw state root so /home/node/.openclaw/media resolves correctly.
      - openclaw_state:/home/node/.openclaw:ro
    tmpfs:
      - /tmp:exec
    networks:
      ha_signal_private:
        aliases:
          - signal-rpc
      signal_egress:
    expose:
      - "7583"
