networks:
  ha_signal_private:
    external: true
  signal_egress:

volumes:
  signal-cli-config:
    name: signal-cli-rest

services:
  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:0.99@sha256:96578363477d97cb1d8da303791b2ad686b374a255fce4d78c7c6f00ef56cba8
    restart: unless-stopped
    volumes:
      - signal-cli-config:/home/.local/share/signal-cli
    networks:
      ha_signal_private:
        aliases:
          - signal-rest
      signal_egress:
    expose:
      - "8080"
