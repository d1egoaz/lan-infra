networks:
  ha_signal_private:
    external: true
  signal_egress:

volumes:
  signal-cli-config:
    name: signal-cli-rest

services:
  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:0.98@sha256:c51c117d030d051f0cf2ef17f2cb135f1301810f9526a224be67daded8f272d6
    restart: unless-stopped
    volumes:
      - signal-cli-config:/home/.local/share/signal-cli
    networks:
      ha_signal_private:
        aliases:
          - signal-rest
      signal_egress:
    expose:
      - "8080"
