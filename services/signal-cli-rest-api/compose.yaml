networks:
  ha_signal_private:
    external: true
  signal_egress:

volumes:
  signal-cli-config:
    name: signal-cli-rest

services:
  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:0.101@sha256:2cf09d66a86fdd210e42ee91662216364acc27da1163a8c44167a77ea3a6559a
    restart: unless-stopped
    volumes:
      - signal-cli-config:/home/.local/share/signal-cli
    networks:
      ha_signal_private:
        aliases:
          - signal-rest
      signal_egress:
    expose:
      - "8080"
