networks:
  app_network:
    external: true

volumes:
  mosquito-data:
    external: true
    name: mosquitto_mosquito-data

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.4-alpine@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - 1883:1883
      - 9011:9001
    volumes:
      - mosquito-data:/mosquitto
      - mosquito-data:/mosquitto/data
      - mosquito-data:/mosquitto/log
    networks:
      - app_network
