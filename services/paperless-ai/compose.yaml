networks:
  app_network:
    external: true

volumes:
  paperless-ai_data:
    external: true
    name: paperless-ai_paperless-ai_data

services:
  paperless-ai:
    image: clusterzx/paperless-ai:v4.7.0@sha256:eff2134eab69ddfb8ead0c768687a4df22d964ab4b51b3fa5c1b1bac8cb10e5d
    container_name: paperless-ai
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - paperless-ai_data:/app/data
