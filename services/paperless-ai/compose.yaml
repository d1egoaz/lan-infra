networks:
  app_network:
    external: true

volumes:
  paperless-ai_data:
    external: true
    name: paperless-ai_paperless-ai_data

services:
  paperless-ai:
    image: clusterzx/paperless-ai:4.0.0@sha256:bea1e218755ba7940da9748ce64e3d7020f15059eab8eb5c6e5470d3d60436a6
    container_name: paperless-ai
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - paperless-ai_data:/app/data
