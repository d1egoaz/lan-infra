networks:
  app_network:
    external: true

volumes:
  paperless-ai_data:
    external: true
    name: paperless-ai_paperless-ai_data

services:
  paperless-ai:
    image: clusterzx/paperless-ai:4.4.0@sha256:66b219a196c4e244c4f5f09a0fa5f31ac2786e62ff43a61c6eedca3c8ac93937
    container_name: paperless-ai
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - paperless-ai_data:/app/data
