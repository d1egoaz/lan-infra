name: matrix-conduit

networks:
  app_network:
    external: true

services:
  conduit:
    image: matrixconduit/matrix-conduit:v0.10.15@sha256:cb4deab33ea1a6da919a0ea99e76be75d6af5936623fd9dde442a17e2d0b320f
    container_name: conduit
    restart: unless-stopped
    environment:
      CONDUIT_CONFIG: ""
      CONDUIT_SERVER_NAME: diegoa.ca
      CONDUIT_PORT: "6167"
      CONDUIT_ADDRESS: "0.0.0.0"
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit
      CONDUIT_ALLOW_REGISTRATION: "false"
      CONDUIT_ALLOW_FEDERATION: "false"
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: "false"
      CONDUIT_MAX_REQUEST_SIZE: "20000000"
      CONDUIT_TRUSTED_SERVERS: "[]"
      CONDUIT_WELL_KNOWN_CLIENT: "https://matrix.diegoa.ca"
      CONDUIT_WELL_KNOWN_SERVER: "matrix.diegoa.ca:443"
      CONDUIT_MAX_CONCURRENT_REQUESTS: "100"
    volumes:
      - /srv/data/projects/docker-volumes/matrix-conduit:/var/lib/matrix-conduit
    networks:
      - app_network
