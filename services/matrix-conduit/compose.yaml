name: matrix-conduit

networks:
  app_network:
    external: true

services:
  conduit:
    image: matrixconduit/matrix-conduit:v0.10.13@sha256:b0d24248e94f944ca49f90f10c429e3d65f4472bdde25661ecea9840134fb133
    container_name: conduit
    restart: unless-stopped
    environment:
      CONDUIT_CONFIG: ""
      CONDUIT_SERVER_NAME: ${CONDUIT_SERVER_NAME:?set CONDUIT_SERVER_NAME in Portainer}
      CONDUIT_PORT: "6167"
      CONDUIT_ADDRESS: "0.0.0.0"
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit
      CONDUIT_ALLOW_REGISTRATION: ${CONDUIT_ALLOW_REGISTRATION:-false}
      CONDUIT_ALLOW_FEDERATION: "false"
      CONDUIT_MAX_REQUEST_SIZE: "20000000"
      CONDUIT_TRUSTED_SERVERS: "[]"
      CONDUIT_MAX_CONCURRENT_REQUESTS: "100"
    volumes:
      - /srv/data/projects/docker-volumes/matrix-conduit:/var/lib/matrix-conduit
    networks:
      - app_network
