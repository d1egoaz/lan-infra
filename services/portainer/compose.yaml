networks:
  app_network:
    external: true
  cloudflared:
    external: true

volumes:
  portainer_data:
    external: true
    name: portainer_data
  portainer_backups:
    external: true
    name: portainer_backups

services:
  portainer:
    image: portainer/portainer-ee:2.33.7@sha256:d9ca585c2b0aa0636f3c734f6c07bd39f170059023ccbc1a725d9f2f804ddc22
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app_network
      - cloudflared

  backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    container_name: portainer-backup
    restart: unless-stopped
    environment:
      PORTAINER_API_URL: ${PORTAINER_API_URL:-http://portainer:9000/api}
      PORTAINER_USERNAME: ${PORTAINER_USERNAME}
      PORTAINER_PASSWORD: ${PORTAINER_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-3}
      TZ: ${TZ:-America/Vancouver}
    volumes:
      - portainer_backups:/backups
    networks:
      - app_network
    depends_on:
      - portainer
