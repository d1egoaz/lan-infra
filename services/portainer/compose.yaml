networks:
  app_network:
    external: true
  cloudflared:
    external: true

volumes:
  portainer_data:
    external: true
    name: portainer_data

services:
  portainer:
    image: portainer/portainer-ee:2.39.0@sha256:b6a67ff610577472a788d74cd0dfb55be8206d78014fdaed3e68054abea55b06
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app_network
      - cloudflared

  backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    container_name: portainer-backup
    restart: unless-stopped
    init: true  # Proper init for signal handling
    environment:
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      PORTAINER_API_URL: ${PORTAINER_API_URL:-http://portainer:9000/api}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-3}
      TZ: ${TZ:-America/Vancouver}
    volumes:
      - ${BACKUP_HOST_PATH:-/srv/data/backups/portainer}:/backups
    networks:
      - app_network
    depends_on:
      - portainer
