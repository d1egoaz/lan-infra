services:
  portainer:
    image: portainer/portainer-ee:2.33.7@sha256:d9ca585c2b0aa0636f3c734f6c07bd39f170059023ccbc1a725d9f2f804ddc22
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app_network
      - cloudflared

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portainer-backup
    restart: unless-stopped
    environment:
      PORTAINER_URL: ${PORTAINER_URL:-https://portainer:9443}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:?required}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      TZ: ${TZ:-America/Vancouver}
      FIRST_RUN: ${FIRST_RUN:-false}
      # Retention (days)
      RETENTION_DAILY: ${RETENTION_DAILY:-7}
      RETENTION_WEEKLY: ${RETENTION_WEEKLY:-28}
      RETENTION_MONTHLY: ${RETENTION_MONTHLY:-90}
      # Optional hooks for notifications
      PRE_BACKUP_HOOK: ${PRE_BACKUP_HOOK:-}
      POST_BACKUP_HOOK: ${POST_BACKUP_HOOK:-}
      BACKUP_DIR: /backups
    volumes:
      - /srv/data/backups/portainer:/backups
    networks:
      - app_network
    depends_on:
      - portainer
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_network:
    external: true
  cloudflared:
    external: true

volumes:
  portainer_data:
    external: true
