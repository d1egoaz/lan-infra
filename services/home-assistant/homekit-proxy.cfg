global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 1d
  timeout server 1d
  timeout check 3s

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend homekit
  bind :21063-21084
  default_backend homeassistant_homekit

backend homeassistant_homekit
  # With no server port, HAProxy preserves the frontend destination port.
  server homeassistant homeassistant check port 8123 resolvers docker init-addr libc,none

