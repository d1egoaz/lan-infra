volumes:
  homeassistant-data:
    external: true
    name: home-assistant_homeassistant-data

networks:
  homeassistant:
    name: homeassistant
  cloudflared:
    external: true
  app_network:
    external: true
  ha_signal_private:
    name: ha_signal_private
    internal: true

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe"
    volumes:
      - homeassistant-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
    # Resolve the configured HTTPS internal URL through the Docker bridge
    # gateway from inside this container, so HA can fetch its own TTS and
    # media proxy URLs.
    extra_hosts:
      - "ha.lan.diegoa.ca:172.24.0.1"
    privileged: true
    ports:
      - "8123:8123"
      # HomeKit bridge + accessory pairing ports (bridge mode). HomeKit
      # clients are told to reach the Docker host LAN address, so these ports
      # must stay published and reachable there.
      #
      # Deliberate temporary regression: staying off the LAN ipvlan network
      # parks the routable AirPlay source address that #427 added for the
      # HomePod TTS path, because pyatv needs a LAN address to advertise.
      # Attaching the L2 LAN network and moving the advertisement are one
      # change: attach it only once every HomeKit advertisement points at the
      # container LAN address (`advertise_ip` for YAML bridges, plus the
      # Network panel adapter for UI-created bridges). See README.md.
      - "21063-21084:21063-21084"
    networks:
      - homeassistant
      - app_network
      - ha_signal_private
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  # mDNS reflector for HomeKit discovery when HA runs in bridge mode.
  # Reflects multicast DNS between host interfaces/VLANs.
  avahi-reflector:
    image: flungo/avahi:latest@sha256:c12a6027d2f85a3461a9365997b218ccab55e4dde1e435541034ed1bc401ec78
    container_name: avahi-reflector
    restart: unless-stopped
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes
