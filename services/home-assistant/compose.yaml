volumes:
  homeassistant-data:
    external: true
    name: home-assistant_homeassistant-data

networks:
  homeassistant:
    name: homeassistant
  cloudflared:
    external: true
  app_network:
    external: true
  ha_signal_private:
    name: ha_signal_private
    internal: true
  homeassistant_lan:
    name: homeassistant_lan
    external: true

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4"
    volumes:
      - homeassistant-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
    # Keep the configured HTTPS internal URL while resolving it through the
    # Docker bridge gateway from inside this container. This avoids IPvlan
    # host-isolation when HA fetches its own TTS/media proxy URLs.
    extra_hosts:
      - "ha.lan.diegoa.ca:172.24.0.1"
      - "adguard.lan.diegoa.ca:172.24.0.1"
      - "paperless.lan.diegoa.ca:172.24.0.1"
    ports:
      # NPM uses this host publish for ha.lan.diegoa.ca and HA self-fetches.
      # LAN clients use 192.168.42.80:8123; the host IP times out from that LAN
      # because replies leave through IPvlan instead of Docker's reverse NAT.
      - "8123:8123"
    networks:
      homeassistant: {}
      app_network: {}
      ha_signal_private: {}
      homeassistant_lan:
        ipv4_address: 192.168.42.80
    # A routable LAN address is required for AirPlay and HomeKit. HomeKit
    # advertises and serves its ports directly from this IPvlan address.
    devices:
      # Grant the ZHA coordinator instead of all host devices. Additional USB
      # devices need their own mapping. Validate ZHA after recreate.
      - /dev/ttyUSB0:/dev/ttyUSB0

  # mDNS reflector for HomeKit discovery when HA runs in bridge mode.
  # Reflects multicast DNS between host interfaces/VLANs.
  avahi-reflector:
    image: flungo/avahi:latest@sha256:34d45a9cffc47187b8c1c43e1ac2fc1edfbac9e5f08026551ae0cbe67e3498b6
    container_name: avahi-reflector
    restart: unless-stopped
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes
