volumes:
  homeassistant-data:
    external: true
    name: home-assistant_homeassistant-data

networks:
  homeassistant:
    name: homeassistant
  cloudflared:
    external: true
  app_network:
    external: true
  ha_signal_private:
    name: ha_signal_private
    internal: true
  homeassistant_lan:
    name: homeassistant_lan
    external: true

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe"
    volumes:
      - homeassistant-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
    # Keep the configured HTTPS internal URL while resolving it through the
    # Docker bridge gateway from inside this container. This avoids IPvlan
    # host-isolation when HA fetches its own TTS/media proxy URLs.
    extra_hosts:
      - "ha.lan.diegoa.ca:172.24.0.1"
    privileged: true
    networks:
      homeassistant: {}
      app_network: {}
      ha_signal_private: {}
      homeassistant_lan:
        ipv4_address: 192.168.42.80
    # A routable LAN address is required for pyatv's AirPlay RTSP return path.
    # The external ipvlan network is created on the Docker host's LAN NIC.
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  # Preserve the Docker host address used by the UI and existing HomeKit
  # bridges without routing replies through Home Assistant's IPvlan interface.
  # The proxy receives each published connection on this bridge-only network
  # and opens a separate connection to Home Assistant on the same port.
  homeassistant-port-proxy:
    image: haproxy:3.4.4-alpine@sha256:c0afc4864dca9c68694cd1290433f0ee79b5c55be80f6745a165ffe373b9a564
    container_name: homeassistant-port-proxy
    restart: unless-stopped
    depends_on:
      homeassistant:
        condition: service_started
    ports:
      - "8123:8123"
      - "21063-21084:21063-21084"
    volumes:
      - /srv/data/projects/infra/services/home-assistant/lan-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - homeassistant

  # mDNS reflector for HomeKit discovery when HA runs in bridge mode.
  # Reflects multicast DNS between host interfaces/VLANs.
  avahi-reflector:
    image: flungo/avahi:latest@sha256:c12a6027d2f85a3461a9365997b218ccab55e4dde1e435541034ed1bc401ec78
    container_name: avahi-reflector
    restart: unless-stopped
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes
