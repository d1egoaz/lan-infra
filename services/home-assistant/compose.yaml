volumes:
  homeassistant-data:
    external: true
    name: home-assistant_homeassistant-data

networks:
  homeassistant:
    name: homeassistant
  cloudflared:
    external: true
  app_network:
    external: true
  ha_signal_private:
    name: ha_signal_private
    internal: true

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.5.2@sha256:f0baa7922ecec7790c40c41baf08ab218b6ab8db5f96dc03b03a0ae33d987c3d"
    volumes:
      - homeassistant-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
    privileged: true
    ports:
      - "8123:8123"
      # HomeKit bridge + accessory pairing ports (bridge mode)
      - "21063-21084:21063-21084"
    networks:
      - homeassistant
      - app_network
      - ha_signal_private
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  # mDNS reflector for HomeKit discovery when HA runs in bridge mode.
  # Reflects multicast DNS between host interfaces/VLANs.
  avahi-reflector:
    image: flungo/avahi:latest@sha256:803451d0200610298d30d3151240f47c5de4d6558f6a3a36340692048cdf28e0
    container_name: avahi-reflector
    restart: unless-stopped
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes

