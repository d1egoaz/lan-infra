volumes:
  homeassistant-data:
    external: true
    name: home-assistant_homeassistant-data

networks:
  homeassistant:
    name: homeassistant
  cloudflared:
    external: true
  app_network:
    external: true
  ha_signal_private:
    name: ha_signal_private
    internal: true

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.9.1@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918"
    volumes:
      - homeassistant-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
    privileged: true
    ports:
      - "8123:8123"
      # HomeKit bridge + accessory pairing ports (bridge mode)
      - "21063-21084:21063-21084"
    networks:
      - homeassistant
      - app_network
      - ha_signal_private
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  # mDNS reflector for HomeKit discovery when HA runs in bridge mode.
  # Reflects multicast DNS between host interfaces/VLANs.
  avahi-reflector:
    image: flungo/avahi:latest@sha256:c12a6027d2f85a3461a9365997b218ccab55e4dde1e435541034ed1bc401ec78
    container_name: avahi-reflector
    restart: unless-stopped
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes

