volumes:
  homeassistant-data:
    external: true
    name: home-assistant_homeassistant-data

networks:
  homeassistant:
    name: homeassistant
  cloudflared:
    external: true
  app_network:
    external: true
  ha_signal_private:
    name: ha_signal_private
    internal: true

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.7.4@sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3"
    volumes:
      - homeassistant-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
    privileged: true
    ports:
      - "8123:8123"
      # HomeKit bridge + accessory pairing ports (bridge mode)
      - "21063-21084:21063-21084"
    networks:
      - homeassistant
      - app_network
      - ha_signal_private
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  # mDNS reflector for HomeKit discovery when HA runs in bridge mode.
  # Reflects multicast DNS between host interfaces/VLANs.
  avahi-reflector:
    image: flungo/avahi:latest@sha256:99472edda27f9da0b6a38bc604246a5f011f3089b59fb33808e6cdea4c47b5cc
    container_name: avahi-reflector
    restart: unless-stopped
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes

