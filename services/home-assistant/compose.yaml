volumes:
  homeassistant-data:
    external: true
    name: home-assistant_homeassistant-data

networks:
  homeassistant:
    name: homeassistant
  cloudflared:
    external: true
  app_network:
    external: true
  ha_signal_private:
    name: ha_signal_private
    internal: true

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.7.3@sha256:6937c6c51d2f5d6aa66d97e4a68f845bcccd5f9b62cd91992bd6d79b20fe2b3c"
    volumes:
      - homeassistant-data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
    privileged: true
    ports:
      - "8123:8123"
      # HomeKit bridge + accessory pairing ports (bridge mode)
      - "21063-21084:21063-21084"
    networks:
      - homeassistant
      - app_network
      - ha_signal_private
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  # mDNS reflector for HomeKit discovery when HA runs in bridge mode.
  # Reflects multicast DNS between host interfaces/VLANs.
  avahi-reflector:
    image: flungo/avahi:latest@sha256:050cba2fd0d26fabad3e096bfc19cda3dd8aad86f09d070cdef9f57e18928492
    container_name: avahi-reflector
    restart: unless-stopped
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes

