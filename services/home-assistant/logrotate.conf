# Host logrotate drop-in for the Home Assistant in-volume log.
#
# This file is the source of truth for /etc/logrotate.d/home-assistant on
# linux-mini. It is installed by hand (see README.md); Docker and Portainer do
# not deliver it.
#
# Why it exists: Home Assistant starts through s6
# (/etc/services.d/home-assistant/run) with no --log-rotate-days flag, so its
# Python handler rolls /config/home-assistant.log once at startup and never
# again within a session. The Docker json-file driver caps stdout only
# (max-size 10m, max-file 3) and cannot touch this file. Without this drop-in
# the file grows without bound between restarts (~3 MB/day observed).
#
# Run as root to match the volume ownership. The `su` below explicitly selects
# the user and group for this file rather than inheriting the global setting.

/home/docker/volumes/home-assistant_homeassistant-data/_data/home-assistant.log {
    # Time-based rotation: daily, keep a week. maxsize is a backstop that is
    # only evaluated when logrotate runs (once a day via logrotate.timer), so
    # it does not cap the file between runs.
    daily
    rotate 7
    maxsize 25M

    missingok
    notifempty

    # Home Assistant holds the file open and cannot be asked to reopen it, so
    # the copy-then-truncate method is used. It drops any line written in the
    # small window between the copy and the truncate.
    copytruncate
    compress
    delaycompress

    # Date-suffixed names (-YYYYMMDD) keep rotated files out of the way of the
    # .log.1 that Home Assistant itself writes on startup, which would
    # otherwise delete the newest copy produced here.
    dateext

    su root root
}
