networks:
  app_network:
    external: true
  ha_signal_private:
    external: true

volumes:
  nginxproxymanager-data:
    external: true
    name: nginxproxymanager_nginxproxymanager-data

services:
  app:
    image: "jc21/nginx-proxy-manager:2.17.1@sha256:04a9d0835560b9719ab577275f84fe1f713298a1c1e2bdefa034b87f10e062e1"
    restart: unless-stopped
    ports:
      - "80:80" # Public HTTP Port
      - "443:443" # Public HTTPS Port
      - "81:81" # Admin Web Port
    volumes:
      - nginxproxymanager-data:/data
      - nginxproxymanager-data:/etc/letsencrypt
    networks:
      - app_network
      - ha_signal_private
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
