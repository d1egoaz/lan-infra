networks:
  app_network:
    external: true
  ha_signal_private:
    external: true

volumes:
  nginxproxymanager-data:
    external: true
    name: nginxproxymanager_nginxproxymanager-data

services:
  app:
    image: "jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594"
    restart: unless-stopped
    ports:
      - "80:80" # Public HTTP Port
      - "443:443" # Public HTTPS Port
      - "81:81" # Admin Web Port
    volumes:
      - nginxproxymanager-data:/data
      - nginxproxymanager-data:/etc/letsencrypt
    networks:
      - app_network
      - ha_signal_private
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
