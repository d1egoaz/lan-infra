networks:
  app_network:
    external: true
  ha_signal_private:
    external: true

volumes:
  nginxproxymanager-data:
    external: true
    name: nginxproxymanager_nginxproxymanager-data

services:
  app:
    image: "jc21/nginx-proxy-manager:2.15.1@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb"
    restart: unless-stopped
    ports:
      - "80:80" # Public HTTP Port
      - "443:443" # Public HTTPS Port
      - "81:81" # Admin Web Port
    volumes:
      - nginxproxymanager-data:/data
      - nginxproxymanager-data:/etc/letsencrypt
    networks:
      - app_network
      - ha_signal_private
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
